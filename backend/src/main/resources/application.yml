spring:
  application:
    name: iips-pms
  datasource:
    # Local development defaults. For Supabase Postgres use the direct
    # connection on port 5432 (db.<ref>.supabase.co), not the PgBouncer
    # pooler, so Flyway and prepared statements keep working.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pms}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Supabase ships a helper function into the public schema, so Flyway sees a
    # non-empty schema on a brand new database and refuses to migrate without a
    # history table. Baselining at 0 satisfies that check while still letting
    # V1 onward run. Without this, Flyway would baseline at 1, skip the V1 that
    # creates the users table, and fail on V2.
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:mySecretKeyForDevelopmentOnlyChangeInProduction}
  expiration: 900000
  refresh-expiration: 604800000

storage:
  type: ${STORAGE_TYPE:local}
  local:
    path: ${STORAGE_PATH:./uploads}
  bucket: ${STORAGE_BUCKET:project-files}

supabase:
  url: ${SUPABASE_URL:}
  service-key: ${SUPABASE_SERVICE_KEY:}
