name: Docs Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Compile DOT diagrams
        run: |
          for f in docs/diagrams/*.dot; do
            dot -Tpng -Gdpi=150 "$f" -o "${f%.dot}.png";
          done
      - name: Check for uncommitted PNG changes
        run: git diff --exit-code -- docs/diagrams/*.png
